<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <title>Jorge Burgos — Computer Engineering @ UPRM</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1a222c" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="0.32" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#0d1117" stop-opacity="1"/>
    </radialGradient>
    <clipPath id="card">
      <rect width="1200" height="320" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#0d1117"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#fade)"/>

    <!-- Tracked route on the right, echoing the portfolio's project covers -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M820 330L900 250L1040 230L1070 120L1220 90" stroke="#1c242e" stroke-width="6"/>
      <path d="M760 40L880 70L1000 30" stroke="#1c242e" stroke-width="3"/>
      <path d="M900 250L960 330" stroke="#1c242e" stroke-width="3"/>
      <path d="M860 290L900 250L1040 230L1070 120" stroke="#56b6c2" stroke-width="4"/>
    </g>
    <g fill="#0d1117" stroke="#56b6c2" stroke-width="2.5">
      <circle cx="900" cy="250" r="5"/>
      <circle cx="970" cy="240" r="5"/>
      <circle cx="1040" cy="230" r="5"/>
      <circle cx="1055" cy="175" r="5"/>
    </g>
    <circle cx="860" cy="290" r="7" fill="#e2e8f0"/>
    <circle cx="1070" cy="120" r="10" fill="#56b6c2"/>
    <circle cx="1070" cy="120" r="10" fill="none" stroke="#56b6c2" stroke-width="2">
      <animate attributeName="r" values="10;34" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- Text -->
    <g font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">
      <text x="72" y="104" font-size="22" fill="#56b6c2">Hi, my name is</text>
      <text x="68" y="178" font-size="64" font-weight="700" fill="#e2e8f0" letter-spacing="-1">Jorge Burgos<tspan fill="#56b6c2" font-weight="400">▌<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
      <text x="72" y="228" font-size="22" fill="#94a3b3">Computer Engineering @ UPRM</text>
      <text x="72" y="268" font-size="17" fill="#94a3b3"><tspan fill="#56b6c2">▸ </tspan>Backend<tspan fill="#56b6c2">  ▸ </tspan>Data<tspan fill="#56b6c2">  ▸ </tspan>Automation<tspan fill="#56b6c2">  ▸ </tspan>Cloud Security</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="16" fill="none" stroke="#232b36"/>
</svg>
